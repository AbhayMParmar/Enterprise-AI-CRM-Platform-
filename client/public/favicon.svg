<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="accentSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>

    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1D4ED8" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Smooth Rounded App Icon Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Inner Specular Ring -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.2" />

  <!-- Main AI CRM Geometric Apex Emblem -->
  <g filter="url(#shadowGlow)" transform="translate(0, 0)">
    <!-- Top Apex / Chevron -->
    <path d="M 256 96 L 384 176 L 320 216 L 256 176 L 192 216 L 128 176 Z" fill="url(#glowGrad)" opacity="0.95" />

    <!-- Left Wing (Sales Pipeline Flow) -->
    <path d="M 128 196 L 192 236 L 192 336 L 128 296 Z" fill="#93C5FD" opacity="0.90" />

    <!-- Right Wing (AI Intelligence & Automation) -->
    <path d="M 384 196 L 384 296 L 320 336 L 320 236 Z" fill="#60A5FA" opacity="0.90" />

    <!-- Central Hexagonal Neural Core -->
    <polygon points="256,200 304,232 304,296 256,328 208,296 208,232" fill="#FFFFFF" opacity="0.98" />

    <!-- Inner Core Synapse Spark -->
    <polygon points="256,220 286,264 256,308 226,264" fill="url(#bgGrad)" />
    <circle cx="256" cy="264" r="8" fill="url(#accentSpark)" />

    <!-- Bottom Shield Anchor -->
    <path d="M 208 316 L 256 348 L 304 316 L 256 416 Z" fill="url(#glowGrad)" opacity="0.95" />
  </g>
</svg>
