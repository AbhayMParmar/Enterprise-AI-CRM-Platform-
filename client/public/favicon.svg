<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Modern Gradient Palette -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="sparkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0ABFC" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)" />

  <!-- Subtle Inner Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#primaryGradient)" stroke-opacity="0.25" stroke-width="6" />

  <!-- Shield Hexagon Base -->
  <g filter="url(#glow)">
    <!-- Hexagon Outer Node Contour -->
    <path d="M 256 96 L 384 160 L 384 320 L 256 416 L 128 320 L 128 160 Z" 
          fill="none" 
          stroke="url(#primaryGradient)" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Left Geometric Wing (Sales/CRM Growth) -->
    <path d="M 176 192 L 256 144 L 256 240 L 176 288 Z" 
          fill="url(#primaryGradient)" 
          opacity="0.9" />

    <!-- Right Geometric Wing (AI Intelligence) -->
    <path d="M 336 192 L 256 240 L 256 336 L 336 288 Z" 
          fill="url(#sparkGradient)" 
          opacity="0.95" />

    <!-- Center AI Spark Core -->
    <path d="M 256 160 Q 256 230 186 230 Q 256 230 256 300 Q 256 230 326 230 Q 256 230 256 160 Z" 
          fill="#FFFFFF" />

    <!-- Network Dots / Data Nodes -->
    <circle cx="256" cy="96" r="14" fill="#38BDF8" />
    <circle cx="384" cy="160" r="14" fill="#C084FC" />
    <circle cx="384" cy="320" r="14" fill="#818CF8" />
    <circle cx="256" cy="416" r="14" fill="#34D399" />
    <circle cx="128" cy="320" r="14" fill="#2563EB" />
    <circle cx="128" cy="160" r="14" fill="#60A5FA" />
  </g>
</svg>
